# End-to-end tests: drive the real desktop app through tauri-driver,
# against a fake Ollama so no model, GPU or API key is needed. What the
# tests cover and why is in e2e/.
name: E2E

on:
  push:
    branches: [Source_Code]
  workflow_dispatch:
    inputs:
      app_ref:
        description: Commit whose app is built and tested (default — the commit being run). The tests always come from the commit being run.
        required: false
        default: ""
      spec:
        description: Spec file(s) to run, relative to e2e/ (default — all)
        required: false
        default: ""

# Read-only: a test run has nothing to publish.
permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Not windows-latest: that resolves to Server 2025, where WebView2
    # WebDriver sessions fail to start ("DevToolsActivePort file doesn't
    # exist" — actions/runner-images#14738, closed as not planned). The
    # same kind of tests pass on 2022.
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      # Two checkouts so the current tests can be pointed at an older
      # build: proving the freeze test fails on a commit from before the
      # fix needs that commit's app, but it has no e2e/ of its own.
      - name: Check out the tests
        uses: actions/checkout@v4
        with:
          path: harness

      - name: Check out the app under test
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.app_ref || github.sha }}
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            harness/e2e/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Build the app (debug, no installer)
        working-directory: app
        run: |
          npm ci
          npm run tauri build -- --debug --no-bundle

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      # From Microsoft's own endpoint rather than a third-party installer,
      # at the exact version of the WebView2 runtime on this machine — a
      # driver that does not match refuses to start a session.
      - name: Install Edge WebDriver matching WebView2
        run: |
          $keys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $version = $keys |
            ForEach-Object { (Get-ItemProperty -Path $_ -ErrorAction SilentlyContinue).pv } |
            Where-Object { $_ } |
            Select-Object -First 1
          if (-not $version) { throw 'WebView2 runtime version not found in the registry' }
          Write-Host "WebView2 runtime $version"
          $dir = Join-Path $env:RUNNER_TEMP 'edgedriver'
          Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile "$dir.zip"
          Expand-Archive -Path "$dir.zip" -DestinationPath $dir
          & (Join-Path $dir 'msedgedriver.exe') --version
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install test dependencies
        working-directory: harness/e2e
        run: npm ci

      - name: Run the end-to-end tests
        working-directory: harness/e2e
        env:
          APP_PATH: ${{ github.workspace }}\app\src-tauri\target\debug\multi-ai-agents-panel.exe
          SPEC: ${{ inputs.spec }}
        run: |
          if ($env:SPEC) {
            npx wdio run ./wdio.conf.mjs --spec $env:SPEC
          } else {
            npx wdio run ./wdio.conf.mjs
          }

      - name: Upload screenshots of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: harness/e2e/artifacts
          if-no-files-found: ignore
