name: Release

# Builds and publishes a Windows installer whenever a version tag is
# pushed. Unsigned for now (see CI-CD Pipeline.md — code signing is
# deferred, not blocking). A checksum is attached so users can verify
# what they downloaded.
#
# Windows-only by explicit user decision: they have no way to test Linux
# or macOS builds on real hardware, so shipping installers for platforms
# nobody can verify isn't worth it. This also sidesteps the still-open
# upstream Linux AppImage bundling failure ("failed to run linuxdeploy",
# tauri-apps/tauri#14796) that blocked several prior release attempts —
# see Backlog for that history. macOS/Linux config (tauri.macos.conf.json,
# tauri.linux.conf.json, the vendored-Python bundling code paths) is left
# in place, not deleted, in case real-machine testing becomes possible
# later.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Download bundled Windows Python runtime
        # See bridge_support.rs for the "bundle a portable Python so users
        # don't need their own" gap this fills. Fetches the official
        # embeddable package and unpacks it where tauri.windows.conf.json's
        # bundle.resources expects it. Skills bridge only for now — it's
        # pure stdlib, so the vanilla embeddable package (no pip) is enough.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dest = "src-tauri/vendor/python-windows"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.12.8/python-3.12.8-embed-amd64.zip" -OutFile "python-embed.zip"
          Expand-Archive -Path "python-embed.zip" -DestinationPath $dest -Force
      - id: tauri_build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Multi-AI Agents Panel ${{ github.ref_name }}"
          releaseDraft: false
          # Alpha/Beta stage: mark as prerelease. Flip to false only for the
          # first tag with no -alpha/-beta suffix (see CI-CD Pipeline.md).
          prerelease: true
      - name: Generate and upload SHA256 checksum
        # The header comment above claims "a checksum is attached so users
        # can verify what they downloaded" — this step is what actually
        # makes that true. Uses Node's crypto (already available via
        # actions/setup-node) rather than PowerShell's Get-FileHash, purely
        # so this step's logic matches what it was before the multi-OS
        # matrix was dropped — no functional reason to prefer one over the
        # other now that only Windows remains.
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_PATHS: ${{ steps.tauri_build.outputs.artifactPaths }}
        run: |
          # shellcheck disable=SC2016 -- single quotes are intentional: this
          # is a literal JS source string handed to `node -e`, which is
          # what should interpret it, not the outer shell.
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const path = require("path");
            const paths = JSON.parse(process.env.ARTIFACT_PATHS || "[]");
            const lines = paths
              .filter((p) => fs.existsSync(p) && fs.statSync(p).isFile())
              .map((p) => {
                const hash = crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex");
                return `${hash}  ${path.basename(p)}`;
              });
            fs.writeFileSync("checksums-windows-latest.sha256.txt", lines.join("\n") + "\n");
          '
          gh release upload "${{ github.ref_name }}" "checksums-windows-latest.sha256.txt" --clobber
