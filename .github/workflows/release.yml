name: Release

# Builds and publishes installers for Windows, Linux, and macOS whenever a
# version tag is pushed. Unsigned for now (see CI-CD Pipeline.md — code
# signing is deferred, not blocking). Checksums are attached so users can
# verify what they downloaded.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-latest
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri + keyring build deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Multi-AI Agents Panel ${{ github.ref_name }}"
          releaseDraft: false
          # Alpha/Beta stage: mark as prerelease. Flip to false only for the
          # first tag with no -alpha/-beta suffix (see CI-CD Pipeline.md).
          prerelease: true
