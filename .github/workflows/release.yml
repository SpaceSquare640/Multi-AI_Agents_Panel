name: Release

# Builds and publishes a Windows installer whenever a version tag is
# pushed. Unsigned for now (see CI-CD Pipeline.md — code signing is
# deferred, not blocking). A checksum is attached so users can verify
# what they downloaded.
#
# Windows-only by explicit user decision: they have no way to test Linux
# or macOS builds on real hardware, so shipping installers for platforms
# nobody can verify isn't worth it. This also sidesteps the still-open
# upstream Linux AppImage bundling failure ("failed to run linuxdeploy",
# tauri-apps/tauri#14796) that blocked several prior release attempts —
# see Backlog for that history. macOS/Linux config (tauri.macos.conf.json,
# tauri.linux.conf.json, the vendored-Python bundling code paths) is left
# in place, not deleted, in case real-machine testing becomes possible
# later.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone — git-cliff (below)
          # needs it to walk every commit back to the project's start.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Download bundled Windows Python runtime
        # See bridge_support.rs for the "bundle a portable Python so users
        # don't need their own" gap this fills. Fetches the official
        # embeddable package and unpacks it where tauri.windows.conf.json's
        # bundle.resources expects it. Skills bridge only for now — it's
        # pure stdlib, so the vanilla embeddable package (no pip) is enough.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dest = "src-tauri/vendor/python-windows"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.12.8/python-3.12.8-embed-amd64.zip" -OutFile "python-embed.zip"
          Expand-Archive -Path "python-embed.zip" -DestinationPath $dest -Force
      - id: tauri_build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Multi-AI Agents Panel ${{ github.ref_name }}"
          releaseDraft: false
          # Alpha/Beta stage: mark as prerelease. Flip to false only for the
          # first tag with no -alpha/-beta suffix (see CI-CD Pipeline.md).
          prerelease: true
      - name: Generate and upload SHA256 checksum
        # The header comment above claims "a checksum is attached so users
        # can verify what they downloaded" — this step is what actually
        # makes that true. Uses Node's crypto (already available via
        # actions/setup-node) rather than PowerShell's Get-FileHash, purely
        # so this step's logic matches what it was before the multi-OS
        # matrix was dropped — no functional reason to prefer one over the
        # other now that only Windows remains.
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_PATHS: ${{ steps.tauri_build.outputs.artifactPaths }}
        run: |
          # Single quotes below are intentional: this is a literal JS
          # source string handed to `node -e`, which is what should
          # interpret it, not the outer shell.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const path = require("path");
            const paths = JSON.parse(process.env.ARTIFACT_PATHS || "[]");
            const lines = paths
              .filter((p) => fs.existsSync(p) && fs.statSync(p).isFile())
              .map((p) => {
                const hash = crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex");
                return `${hash}  ${path.basename(p)}`;
              });
            fs.writeFileSync("checksums-windows-latest.sha256.txt", lines.join("\n") + "\n");
          '
          gh release upload "${{ github.ref_name }}" "checksums-windows-latest.sha256.txt" --clobber
      - name: Generate this version's changelog section for the Release notes
        # Runs BEFORE the full-CHANGELOG.md step below, deliberately — `git
        # cliff --current` needs HEAD to still be exactly the tagged commit
        # to resolve "the current tag" at all; committing CHANGELOG.md back
        # to main first would move HEAD past the tag and break this with
        # `ChangelogError("No tag exists for the current commit")` (hit
        # this for real in v0.1.84-alpha before reordering — see Backlog).
        id: git-cliff-current
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --current --strip header
      - name: Generate full CHANGELOG.md
        # See cliff.toml for why this includes the project's whole history
        # (not just Conventional-Commits-formatted commits) — the repo's
        # pre-2026-08-21 commits predate that convention, and per the
        # project's own research (Public Release Best Practices /
        # Changelog Automation Options in the Obsidian vault) rewriting
        # that history isn't worth it. Regenerated fresh on every tag so
        # CHANGELOG.md never drifts from the actual git log.
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
      - name: Commit updated CHANGELOG.md back to main
        # A tag push doesn't update any branch, so this has to be a
        # separate explicit push to main — safe to do here since this
        # workflow only triggers on tag push, not on push to main, so
        # there's no risk of it re-triggering itself in a loop (ci.yml
        # picking up the push is expected and fine, it's just the normal
        # fast-checks job).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "chore: update CHANGELOG.md for ${{ github.ref_name }} [skip ci]"
          git push origin HEAD:main
      - name: Set the GitHub Release notes to this version's changelog section
        # Deliberately routed through an env var + --notes-file rather than
        # `--notes "${{ steps.git-cliff-current.outputs.content }}"` — the
        # changelog content is multi-line and can contain quotes/backticks
        # from commit messages, which is exactly the shape of input GitHub
        # Actions' own security guidance warns against interpolating
        # directly into a `run:` script body (breaks quoting at best, is a
        # script-injection vector at worst). An env var is expanded by the
        # shell, not substituted into the script text before it's parsed.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.git-cliff-current.outputs.content }}
        run: |
          printf '%s' "$RELEASE_NOTES" > release-notes.md
          gh release edit "${{ github.ref_name }}" --notes-file release-notes.md
