name: CI

# Fast checks on every push/PR to the default branch. Full release builds are
# a separate workflow triggered by version tags.
#
# The branch filter must name the branch this repository actually uses. It said
# `main` after the default branch had been renamed to `Source_Code`, which did
# not turn CI red — it stopped CI from running at all, so nothing was left to
# go red. A workflow that never fires is worse than a failing one: the failing
# one still tells you something.
on:
  push:
    branches: [Source_Code]
  pull_request:
    branches: [Source_Code]

# Declared rather than inherited from the repository default, so a change to
# that setting cannot silently widen or narrow what these jobs can do.
permissions:
  contents: read

jobs:
  secret-scan:
    # Automated secret scanning — closes a real gap in Vision & Goals.md's
    # open-source-governance checklist ("confirm the repo never leaks API
    # keys/local paths/personal accounts"). Until now the only defense was
    # a manual `grep` for a few known key-prefix patterns before each
    # commit, run by whoever's committing — that's a human-reliability
    # single point of failure, and once this repo is public it also needs
    # to protect against secrets introduced by outside contributors' PRs,
    # which a personal pre-commit habit can't do at all. gitleaks scans
    # the whole diff with a much broader rule set than a few grep patterns.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks CLI directly, not gitleaks-action.
      #
      # The action's pull-request mode calls the GitHub API to post findings
      # back onto the PR, which needs `pull-requests: write`. This repository's
      # default workflow permission is read-only, and GITHUB_TOKEN is forced
      # read-only on Dependabot pull requests regardless of what the workflow
      # asks for — so the action could never succeed here. It failed on every
      # single PR, which meant secret scanning, the control that exists because
      # a public repo must not leak keys, had never actually run on a PR.
      #
      # Scanning is the part that matters; the PR comment was decoration that
      # happened to be the thing that broke. The CLI exits non-zero on a
      # finding, and a failed job is a loud enough signal.
      - name: Install gitleaks
        run: |
          VERSION=8.24.3
          curl -sSfL -o /tmp/gitleaks.tar.gz             "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history for secrets
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  lint-workflows:
    # Validates the workflow YAML files themselves (ci.yml, release.yml) —
    # schema errors, invalid action inputs, shellcheck issues in `run:`
    # blocks, etc. Added after discovering Swatinem/rust-cache@v2 had been
    # silently ignoring an invalid `workingDirectories` input (should have
    # been `workspaces`) for an unknown amount of time — this class of
    # mistake doesn't fail the build, it just silently degrades CI (e.g.
    # broken caching), so a plain `cargo build`/`npm run build` passing
    # doesn't catch it; only checking the workflow file's own correctness
    # does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
      - name: Check workflow files
        run: ${{ steps.get_actionlint.outputs.executable }} -color

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux Tauri + keyring build deps
        run: |
          sudo apt-get update
          # libxdo-dev: needed by `enigo` (game_agent's mouse/keyboard
          # automation on X11). libpipewire-0.3-dev: needed by `xcap`
          # (game_agent's screen capture, Wayland/PipeWire portal
          # backend) — see Backlog's Linux system-dep caveat.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config gnome-keyring dbus-x11 libxdo-dev libpipewire-0.3-dev libgbm-dev
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Check for rustdoc warnings (e.g. un-hyperlinked bare URLs)
        run: cargo doc --manifest-path src-tauri/Cargo.toml --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Check dependencies for known vulnerabilities
        # `cargo audit`'s default behavior (verified locally against this
        # exact Cargo.lock) only fails on real RUSTSEC "vulnerability"
        # advisories — the current lockfile has ~19 "unmaintained"/
        # "unsound" warnings (all in Tauri's own transitive GTK/glib
        # dependencies on Linux, nothing this project can fix directly)
        # and those don't fail the build, only real CVEs would.
        run: cargo audit --file src-tauri/Cargo.lock
      - name: Run tests under a real D-Bus Secret Service
        # `key_vault` uses the OS credential store — on Linux that's the
        # D-Bus Secret Service, which a bare GitHub runner doesn't have
        # running. `dbus-run-session` starts a throwaway session bus, and
        # unlocking gnome-keyring with an empty password (piped via `-c`)
        # starts a real (if not very secret) Secret Service on it, which
        # is all `key_vault::tests::set_get_delete_round_trip` needs.
        run: |
          # Single quotes below are intentional: this is a literal script
          # string handed to the nested `bash -c`, which is what should
          # expand $(...)/$VAR, not the outer shell.
          # shellcheck disable=SC2016
          dbus-run-session -- bash -c '
            eval "$(printf "\n" | gnome-keyring-daemon --unlock)"
            eval "$(printf "\n" | gnome-keyring-daemon --start --components=secrets)"
            export GNOME_KEYRING_CONTROL DBUS_SESSION_BUS_ADDRESS
            cargo test --manifest-path src-tauri/Cargo.toml
          '
