name: Build the Windows app
description: >
  Sets up the toolchain, vendors the bundled Python runtime, and builds the
  Windows app. Shared by the tagged Release build and the on-demand test
  build so the two cannot drift apart.

# Why this is a composite action rather than duplicated steps
#
# A test build is only worth anything if it is the *same* build as the one
# that ships. Two copies of these steps would start identical and diverge
# quietly — a Python version bumped in one file, a toolchain pinned in the
# other — and the day they diverged is the day a test build would pass
# while the real installer failed, with nothing to point at. There is no
# warning for that; the only defence is that there is one copy.
#
# What is *not* shared is the release side: creating the GitHub Release,
# the checksum, and the changelog all belong to `release.yml` alone. This
# action stops at "a built installer exists".

inputs:
  tagName:
    description: >
      Tag to publish a GitHub Release for. Leave empty (the default) to
      build only — tauri-action creates no Release when this is unset,
      which is exactly what the test build wants.
    required: false
    default: ""
  releaseName:
    description: Title of the GitHub Release, when one is being created.
    required: false
    default: ""
  githubToken:
    description: >
      Only needed when publishing a Release. Empty for a plain build, so a
      test build cannot write to the repository even by accident.
    required: false
    default: ""

outputs:
  artifactPaths:
    description: JSON array of the files tauri-action produced.
    value: ${{ steps.tauri_build.outputs.artifactPaths }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    - uses: dtolnay/rust-toolchain@stable
    - run: npm ci
      shell: bash
    - name: Download bundled Windows Python runtime
      # See bridge_support.rs for the "bundle a portable Python so users
      # don't need their own" gap this fills. Fetches the official
      # embeddable package and unpacks it where tauri.windows.conf.json's
      # bundle.resources expects it. Skills bridge only for now — it's
      # pure stdlib, so the vanilla embeddable package (no pip) is enough.
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $dest = "src-tauri/vendor/python-windows"
        New-Item -ItemType Directory -Force -Path $dest | Out-Null
        Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.12.8/python-3.12.8-embed-amd64.zip" -OutFile "python-embed.zip"
        Expand-Archive -Path "python-embed.zip" -DestinationPath $dest -Force
    - id: tauri_build
      uses: tauri-apps/tauri-action@v1
      env:
        GITHUB_TOKEN: ${{ inputs.githubToken }}
      with:
        tagName: ${{ inputs.tagName }}
        releaseName: ${{ inputs.releaseName }}
        releaseDraft: false
        # GA as of v1.0.0 (user decision, see CI-CD Pipeline.md) — no more
        # -alpha/-beta suffixes, tags are no longer marked prerelease.
        prerelease: false
