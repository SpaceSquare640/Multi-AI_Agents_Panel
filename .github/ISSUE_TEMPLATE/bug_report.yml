name: Bug report
description: Report a reproducible defect in Multi-AI Agents Panel.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this — the more reproducible, the faster it can be fixed.
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Settings → About, or the installer filename (e.g. `0.1.96-alpha`).
      placeholder: 0.1.96-alpha
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: Only Windows installers are currently published (see README) — if you built from source on another OS, say so below.
      options:
        - Windows 11
        - Windows 10
        - Other / built from source
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider(s) involved, if relevant
      multiple: true
      options:
        - Anthropic
        - OpenAI
        - OpenRouter
        - Ollama (local)
        - colibrì (local)
        - Not provider-related
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: What did you do, in order? Include exact settings/inputs where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact error text — this app shows an `E####` error code in most failure messages (see the Error Code Registry); please paste it verbatim if one appeared.
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: Before you submit
      options:
        - label: This is not a security vulnerability (see `SECURITY.md` for how to report those privately instead)
          required: true
