name: Feature request
description: Suggest an idea or improvement for Multi-AI Agents Panel.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This is an actively-developed hobby project — a quick search of
        existing issues before filing helps avoid duplicates.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do that the app doesn't support today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you want the app to do instead? Sketches, mockups, or references to similar tools are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
